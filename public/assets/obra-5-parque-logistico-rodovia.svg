<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Sky -->
  <rect width="1200" height="400" fill="#7dd3fc"/>

  <!-- Grassy Hill/Embankment -->
  <polygon points="0,400 1200,320 1200,600 0,650" fill="#65a30d"/>
  <polygon points="0,520 1200,480 1200,600 0,650" fill="#4d7c0f"/>

  <!-- Large Precast Logistics Building (Facing Highway) -->
  <polygon points="200,320 1150,210 1150,450 200,520" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>

  <!-- Precast Wall Panel Vertical Joint Lines -->
  <line x1="350" y1="305" x2="350" y2="505" stroke="#64748b" stroke-width="2"/>
  <line x1="500" y1="290" x2="500" y2="490" stroke="#64748b" stroke-width="2"/>
  <line x1="650" y1="275" x2="650" y2="475" stroke="#64748b" stroke-width="2"/>
  <line x1="800" y1="260" x2="800" y2="460" stroke="#64748b" stroke-width="2"/>
  <line x1="950" y1="245" x2="950" y2="445" stroke="#64748b" stroke-width="2"/>

  <!-- Reflective Blue Window Band (Right Executive Wing) -->
  <polygon points="650,290 1150,240 1150,300 650,340" fill="#0284c7" opacity="0.9"/>
  <!-- Glass Window Frames -->
  <line x1="750" y1="280" x2="750" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <line x1="850" y1="270" x2="850" y2="320" stroke="#38bdf8" stroke-width="3"/>
  <line x1="950" y1="260" x2="950" y2="310" stroke="#38bdf8" stroke-width="3"/>
  <line x1="1050" y1="250" x2="1050" y2="300" stroke="#38bdf8" stroke-width="3"/>

  <!-- Secondary Precast Hall in Background (Left) -->
  <polygon points="0,380 200,350 200,500 0,520" fill="#94a3b8" stroke="#475569"/>

  <!-- Highway Guardrail and Road in Foreground -->
  <polygon points="0,650 1200,600 1200,800 0,800" fill="#334155"/>
  <!-- White Highway Lane Marking -->
  <line x1="0" y1="720" x2="1200" y2="680" stroke="#ffffff" stroke-dasharray="40 25" stroke-width="6"/>
  <!-- Guardrail -->
  <line x1="0" y1="640" x2="1200" y2="590" stroke="#94a3b8" stroke-width="8"/>
  <line x1="0" y1="650" x2="1200" y2="600" stroke="#cbd5e1" stroke-width="5"/>

  <!-- Trucks on Highway/Site -->
  <rect x="420" y="500" width="80" height="25" fill="#dc2626" rx="4"/>
  <rect x="490" y="500" width="30" height="25" fill="#f8fafc" rx="4"/>

  <!-- Watermark Badge -->
  <rect x="20" y="20" width="380" height="45" rx="10" fill="#0f172a" opacity="0.85"/>
  <text x="35" y="48" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">OBRA REAL: Galpão Logístico em Rodovia</text>
</svg>
