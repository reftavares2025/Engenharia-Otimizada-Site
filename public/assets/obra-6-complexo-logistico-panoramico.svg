<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Aerial Sky & Horizon -->
  <rect width="1200" height="300" fill="#93c5fd"/>
  <polygon points="0,200 1200,200 1200,350 0,350" fill="#a3e635" opacity="0.6"/>

  <!-- Countryside Fields (Green Landscape Background) -->
  <polygon points="0,280 1200,280 1200,500 0,500" fill="#65a30d"/>

  <!-- Multi-Bay Mega Logistics Center Complex (Drone Aerial View) -->
  <!-- Building 1 (Left Precast Warehouse) -->
  <polygon points="250,300 480,290 480,360 250,370" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>

  <!-- Building 2 (Main Center Solar Power Roof Warehouse) -->
  <polygon points="460,310 700,300 680,410 440,420" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <!-- Solar Panels Grid on Roof -->
  <polygon points="480,320 680,310 665,390 460,400" fill="#1e3a8a"/>
  <line x1="530" y1="318" x2="515" y2="398" stroke="#38bdf8" stroke-width="2"/>
  <line x1="580" y1="315" x2="565" y2="395" stroke="#38bdf8" stroke-width="2"/>
  <line x1="630" y1="312" x2="615" y2="392" stroke="#38bdf8" stroke-width="2"/>

  <!-- Building 3 (Right Administrative & Logistics Building with Blue Glass Front) -->
  <polygon points="660,310 1120,310 1100,450 640,450" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
  <!-- Blue Reflective Facade -->
  <polygon points="780,340 1100,340 1090,410 770,410" fill="#0284c7"/>

  <!-- Paved Asphalt Truck Yard / Loading Dock Court -->
  <polygon points="200,370 1180,370 1200,580 0,580" fill="#334155"/>

  <!-- Semi-Trucks / B-Doubles in Yard -->
  <rect x="520" y="420" width="60" height="20" fill="#f8fafc" rx="3"/>
  <rect x="585" y="420" width="20" height="20" fill="#dc2626" rx="3"/>

  <rect x="640" y="430" width="65" height="22" fill="#f8fafc" rx="3"/>
  <rect x="710" y="430" width="22" height="22" fill="#15803d" rx="3"/>

  <!-- Highway in Foreground -->
  <polygon points="0,580 1200,580 1200,800 0,800" fill="#1e293b"/>
  <!-- Highway Lanes -->
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#ffffff" stroke-width="4"/>
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#f59e0b" stroke-dasharray="30 20" stroke-width="5"/>
  <line x1="0" y1="760" x2="1200" y2="760" stroke="#ffffff" stroke-width="4"/>

  <!-- Watermark Badge -->
  <rect x="20" y="20" width="420" height="45" rx="10" fill="#0f172a" opacity="0.85"/>
  <text x="35" y="48" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">OBRA REAL: Complexo Logístico Panorâmico</text>
</svg>
