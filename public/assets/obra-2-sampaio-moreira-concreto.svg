<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Bright Blue Sky -->
  <rect width="1200" height="400" fill="#38bdf8"/>

  <!-- Neighboring Buildings -->
  <rect x="0" y="200" width="180" height="500" fill="#cbd5e1" stroke="#475569"/>
  <rect x="900" y="250" width="300" height="450" fill="#e2e8f0" stroke="#64748b"/>

  <!-- Precast Concrete Warehouse Facade (Center) -->
  <rect x="180" y="30" width="720" height="670" fill="#94a3b8" stroke="#475569" stroke-width="4"/>

  <!-- Precast Concrete Panel Joints (Horizontal & Vertical) -->
  <line x1="180" y1="180" x2="900" y2="180" stroke="#64748b" stroke-width="3"/>
  <line x1="180" y1="320" x2="900" y2="320" stroke="#64748b" stroke-width="3"/>
  <line x1="180" y1="460" x2="900" y2="460" stroke="#64748b" stroke-width="3"/>
  <line x1="420" y1="30" x2="420" y2="700" stroke="#64748b" stroke-width="2"/>
  <line x1="660" y1="30" x2="660" y2="700" stroke="#64748b" stroke-width="2"/>

  <!-- Green Louver Ventilation Grill Line -->
  <rect x="220" y="195" width="640" height="60" fill="#14532d"/>
  <line x1="220" y1="210" x2="860" y2="210" stroke="#22c55e" stroke-width="2"/>
  <line x1="220" y1="225" x2="860" y2="225" stroke="#22c55e" stroke-width="2"/>
  <line x1="220" y1="240" x2="860" y2="240" stroke="#22c55e" stroke-width="2"/>

  <!-- Large Open Entrance Gate -->
  <rect x="440" y="440" width="200" height="260" fill="#1e293b"/>

  <!-- Electrical Power Pole in Foreground with Transformer -->
  <rect x="260" y="100" width="28" height="600" fill="#475569"/>
  <!-- Transformer Unit -->
  <rect x="235" y="240" width="78" height="70" rx="8" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
  <line x1="200" y1="120" x2="350" y2="120" stroke="#0f172a" stroke-width="5"/>
  <line x1="210" y1="140" x2="340" y2="140" stroke="#0f172a" stroke-width="4"/>
  <!-- Power Wires -->
  <path d="M 0 120 Q 260 180 1200 110" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M 0 140 Q 260 200 1200 130" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- Street & Parked Vehicles -->
  <rect x="0" y="700" width="1200" height="100" fill="#334155"/>
  <!-- White Car -->
  <rect x="80" y="720" width="180" height="60" rx="15" fill="#f8fafc"/>
  <!-- White Citroën -->
  <rect x="720" y="710" width="160" height="55" rx="12" fill="#ffffff"/>

  <!-- Watermark Badge -->
  <rect x="20" y="20" width="380" height="45" rx="10" fill="#0f172a" opacity="0.85"/>
  <text x="35" y="48" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">OBRA REAL: Edifício Industrial de Concreto</text>
</svg>
