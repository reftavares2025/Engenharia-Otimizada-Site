<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Sky -->
  <rect width="1200" height="500" fill="#7dd3fc"/>
  <!-- Street Road -->
  <polygon points="0,500 1200,500 1200,800 0,800" fill="#334155"/>
  <!-- Sidewalk -->
  <polygon points="0,480 1200,480 1200,510 0,510" fill="#94a3b8"/>

  <!-- Precast Concrete Corner Building -->
  <!-- Main Corner Structure -->
  <polygon points="180,150 780,150 780,480 180,480" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <polygon points="780,150 1050,200 1050,480 780,480" fill="#94a3b8" stroke="#475569" stroke-width="3"/>

  <!-- Horizontal Blue Glass Window Strip -->
  <polygon points="180,260 780,260 780,310 180,310" fill="#1e40af" opacity="0.95"/>
  <polygon points="780,260 1050,285 1050,325 780,310" fill="#1d4ed8" opacity="0.95"/>
  <!-- Glass Reflections -->
  <line x1="220" y1="265" x2="320" y2="305" stroke="#93c5fd" stroke-width="4"/>
  <line x1="420" y1="265" x2="520" y2="305" stroke="#93c5fd" stroke-width="4"/>
  <line x1="620" y1="265" x2="720" y2="305" stroke="#93c5fd" stroke-width="4"/>

  <!-- Precast Panel Joint Lines (Vertical & Horizontal) -->
  <line x1="330" y1="150" x2="330" y2="480" stroke="#64748b" stroke-width="2"/>
  <line x1="480" y1="150" x2="480" y2="480" stroke="#64748b" stroke-width="2"/>
  <line x1="630" y1="150" x2="630" y2="480" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="380" x2="780" y2="380" stroke="#64748b" stroke-width="2"/>
  <line x1="780" y1="380" x2="1050" y2="395" stroke="#475569" stroke-width="2"/>

  <!-- Green Sidewalk Trees -->
  <circle cx="450" cy="420" r="60" fill="#15803d"/>
  <rect x="444" y="450" width="12" height="35" fill="#78350f"/>

  <circle cx="950" cy="400" r="70" fill="#166534"/>
  <rect x="944" y="440" width="12" height="40" fill="#78350f"/>

  <!-- Power Pole on Left Street -->
  <rect x="400" y="140" width="10" height="340" fill="#64748b"/>

  <!-- Watermark Badge -->
  <rect x="20" y="20" width="380" height="45" rx="10" fill="#0f172a" opacity="0.85"/>
  <text x="35" y="48" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">OBRA REAL: Edifício Comercial de Esquina</text>
</svg>
