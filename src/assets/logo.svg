<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- White Background -->
  <rect width="500" height="500" fill="#ffffff"/>
  
  <!-- Graphic Symbol Group -->
  <g transform="translate(130, 40)">
    <!-- Top Structural Pillar Lattice -->
    <!-- Main Vertical Column -->
    <rect x="108" y="20" width="24" height="130" fill="#374151"/>
    
    <!-- Top Triangular Cap -->
    <polygon points="120,0 102,20 138,20" fill="#374151"/>
    
    <!-- Cross Bracing Beams (Dark Slate & Blue) -->
    <!-- Horizontal Cross Beams with Pin End Nodes -->
    <line x1="80" y1="45" x2="160" y2="45" stroke="#1e3a8a" stroke-width="5"/>
    <circle cx="80" cy="45" r="5" fill="#2563eb"/>
    <circle cx="160" cy="45" r="5" fill="#2563eb"/>
    
    <line x1="70" y1="85" x2="170" y2="85" stroke="#1e3a8a" stroke-width="5"/>
    <circle cx="70" cy="85" r="5" fill="#2563eb"/>
    <circle cx="170" cy="85" r="5" fill="#2563eb"/>

    <!-- Diagonal Truss Bracing -->
    <line x1="80" y1="45" x2="120" y2="85" stroke="#475569" stroke-width="4"/>
    <line x1="160" y1="45" x2="120" y2="85" stroke="#475569" stroke-width="4"/>
    <line x1="70" y1="85" x2="120" y2="125" stroke="#475569" stroke-width="4"/>
    <line x1="170" y1="85" x2="120" y2="125" stroke="#475569" stroke-width="4"/>

    <!-- Vertical Structural Ribs -->
    <line x1="92" y1="20" x2="92" y2="85" stroke="#374151" stroke-width="4"/>
    <line x1="148" y1="20" x2="148" y2="85" stroke="#374151" stroke-width="4"/>

    <!-- RT Monogram (Bold Dark Grey Block Letters) -->
    <g fill="#374151" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="115">
      <text x="35" y="240" letter-spacing="-5">RT</text>
    </g>

    <!-- Red Curved Swoosh Arrow -->
    <path d="M 0 160 C 20 220, 110 230, 180 100" fill="none" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/>
    <!-- Arrow Head -->
    <polygon points="180,100 170,125 195,120" fill="#dc2626"/>
  </g>

  <!-- Logo Typography -->
  <!-- Line 1: Régis Tavares -->
  <text x="250" y="360" text-anchor="middle" fill="#0f172a" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="42" letter-spacing="-1">Régis Tavares</text>

  <!-- Line 2: ENGENHARIA CIVIL | CONTROLE DE OBRAS -->
  <text x="250" y="395" text-anchor="middle" fill="#1d4ed8" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="16" letter-spacing="1">ENGENHARIA CIVIL | CONTROLE DE OBRAS</text>

  <!-- Line 3: ENGENHARIA OTIMIZADA -->
  <text x="250" y="425" text-anchor="middle" fill="#dc2626" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="18" letter-spacing="2">ENGENHARIA OTIMIZADA</text>
</svg>
